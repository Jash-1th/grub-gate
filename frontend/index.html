<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/Logo.png" />
    <link rel="apple-touch-icon" href="/icons/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="GrubGate - Your Daily Meals, Delivered from Real Kitchens. Montreal's premier subscription meal delivery service." />
    <meta name="keywords" content="food delivery, meal subscription, Montreal restaurants, fresh meals" />
    <meta name="author" content="GrubGate" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme and Status Bar -->
    <meta name="theme-color" content="#800020" />
    <meta name="msapplication-TileColor" content="#800020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GrubGate" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="GrubGate - Your Daily Meals, Delivered" />
    <meta property="og:description" content="Montreal's premier subscription meal delivery service. Fresh, chef-prepared meals from local restaurants." />
    <meta property="og:image" content="/icons/logo512.png" />
    <meta property="og:url" content="https://grubgate.app" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GrubGate - Your Daily Meals, Delivered" />
    <meta name="twitter:description" content="Montreal's premier subscription meal delivery service." />
    <meta name="twitter:image" content="/icons/logo512.png" />
    
    <title>GrubGate - Your Daily Meals, Delivered from Real Kitchens</title>
    
    <!-- Preload critical assets for smooth loading -->
    <link rel="preload" href="/images/launch-background.jpg" as="image" type="image/jpeg">
    <link rel="preload" href="/icons/logo512.png" as="image" type="image/png">
    
    <!-- Critical CSS for App Shell - External file for SSR compatibility -->
    <link rel="stylesheet" href="/critical.css">
    
    <!-- Inline CSS for Launch Screen - No delay in styling -->
    <style>
      /* Launch Screen Styles */
      .launch-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #800020 0%, #a00028 50%, #800020 100%);
        background-image: url('/images/launch-background.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: scroll;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                    visibility 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                    transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }
      
      /* Ensure background covers all screen orientations */
      @media screen and (orientation: portrait) {
        .launch-screen {
          background-size: contain;
          background-position: center center;
          background-color: #1a1a1a; /* Dark background for empty areas */
        }
      }
      
      /* For larger portrait screens, use cover */
      @media screen and (orientation: portrait) and (min-width: 768px) {
        .launch-screen {
          background-size: cover;
          background-color: transparent;
        }
      }
      
      @media screen and (orientation: landscape) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      /* Handle different aspect ratios */
      @media screen and (max-aspect-ratio: 1/1) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      @media screen and (min-aspect-ratio: 2/1) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      .launch-screen.hidden,
      body.app-loaded .launch-screen {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.05);
        pointer-events: none;
      }
      
      /* Loading Indicator Styles */
      .loading-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      
      /* CSS Spinner Animation */
      .css-loader {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-left: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      
      
      /* Ensure the app shell loader is hidden initially when launch screen is visible */
      .launch-screen + .app-shell-loader {
        display: none;
      }
      
      /* Comprehensive responsive adjustments for all devices */
      
      /* Very small mobile phones */
      @media screen and (max-width: 480px) {
        .css-loader {
          width: 35px;
          height: 35px;
          border-width: 3px;
        }
      }
      
      /* Extra small devices (phones, 600px and down) */
      @media screen and (max-width: 600px) {
        .css-loader {
          width: 40px;
          height: 40px;
          border-width: 3px;
        }
      }
      
      /* Small devices (portrait tablets and large phones, 600px and up) */
      @media screen and (min-width: 600px) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      /* Medium devices (landscape tablets, 768px and up) */
      @media screen and (min-width: 768px) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
        .css-loader {
          width: 60px;
          height: 60px;
        }
      }
      
      /* Large devices (laptops/desktops, 992px and up) */
      @media screen and (min-width: 992px) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
        .css-loader {
          width: 80px;
          height: 80px;
          border-width: 5px;
        }
      }
      
      /* Extra large devices (large laptops and desktops, 1200px and up) */
      @media screen and (min-width: 1200px) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      /* Ultra-wide screens */
      @media screen and (min-width: 1600px) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
      
      /* High DPI displays */
      @media screen and (-webkit-min-device-pixel-ratio: 2), 
             screen and (min-resolution: 192dpi), 
             screen and (min-resolution: 2dppx) {
        .launch-screen {
          background-size: cover;
          background-position: center center;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Launch Screen - Full screen background with only loading indicator -->
      <div class="launch-screen" id="launch-screen">
        <div class="loading-indicator">
          <div class="css-loader"></div>
        </div>
      </div>
      
      <!-- App Shell Loader - Fallback loader (hidden when launch screen is visible) -->
      <div class="app-shell-loader" id="app-shell-loader">
        <img 
          src="/icons/logo512.png" 
          alt="GrubGate Logo" 
          class="loader-logo"
          width="120"
          height="120"
        />
        <h1 class="loader-title">GrubGate</h1>
        <p class="loader-subtitle">Your Daily Meals, Delivered from Real Kitchens</p>
        <div class="loader-spinner"></div>
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
      <!--ssr-outlet-->
    </div>
    
    <!-- Service Worker Registration and App Loading Coordination -->
    <script>
      // Track loading state
      let appInitialized = false;
      let imagePreloaded = false;
      
      // Preload background image and handle loading
      function preloadBackgroundImage() {
        const img = new Image();
        img.onload = function() {
          imagePreloaded = true;
          console.log('✅ Launch background image preloaded');
          // Add a small delay to ensure smooth loading
          if (appInitialized) {
            setTimeout(() => initializeApp(), 200);
          }
        };
        img.onerror = function() {
          imagePreloaded = true; // Continue even if image fails
          console.warn('⚠️ Launch background image failed to load, using fallback');
          if (appInitialized) {
            setTimeout(() => initializeApp(), 200);
          }
        };
        img.src = '/images/launch-background.jpg';
      }
      
      // Initialize app coordination
      function initializeApp() {
        if (!imagePreloaded || !appInitialized) return;
        
        // Hide app shell loader immediately
        const appShellLoader = document.getElementById('app-shell-loader');
        if (appShellLoader) {
          appShellLoader.style.display = 'none';
        }
        
        console.log('✅ App initialization coordinated');
      }
      
      // Start preloading immediately
      preloadBackgroundImage();
      
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(registration) {
              console.log('✅ Service Worker registered successfully:', registration.scope);
            })
            .catch(function(error) {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
      
      // Coordinated app loading
      window.addEventListener('load', function() {
        appInitialized = true;
        console.log('✅ DOM fully loaded');
        
        // Try to initialize if image is ready
        if (imagePreloaded) {
          setTimeout(() => initializeApp(), 200);
        }
      });
      
      // Enhanced launch screen hiding with better coordination
      window.hideLaunchScreen = function() {
        const launchScreen = document.getElementById('launch-screen');
        if (!launchScreen) return;
        
        console.log('🚀 Hiding launch screen - React app ready');
        
        // Add loaded class for transition
        document.body.classList.add('app-loaded');
        
        // Remove from DOM after transition
        setTimeout(() => {
          if (launchScreen && launchScreen.parentNode) {
            launchScreen.parentNode.removeChild(launchScreen);
            console.log('✨ Launch screen removed - App fully loaded');
          }
        }, 800); // Match CSS transition duration
      };
      
      // Legacy support - hide app shell loader (backup)
      window.hideAppShellLoader = function() {
        // First try to hide launch screen
        window.hideLaunchScreen();
        
        // Then hide app shell loader as fallback
        const loader = document.getElementById('app-shell-loader');
        if (loader) {
          document.body.classList.add('js-loaded');
          loader.style.display = 'none';
        }
      };
      
      // Automatic fallback - hide launch screen after maximum time
      setTimeout(() => {
        if (document.getElementById('launch-screen')) {
          console.log('⚡ Fallback: Hiding launch screen after timeout');
          window.hideLaunchScreen();
        }
      }, 4000); // 4 seconds maximum
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
