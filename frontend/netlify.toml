[build]
  publish = "dist/client"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

# For SSR on Netlify (Edge Functions)
[[edge_functions]]
  function = "ssr"
  path = "/*"
