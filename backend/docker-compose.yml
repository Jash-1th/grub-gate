version: '3.8'

services:
  # MongoDB service for local development
  mongodb:
    image: mongo:7.0
    container_name: grubgate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: grubgate
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - grubgate-network

  # Redis service for caching and sessions
  redis:
    image: redis:7.2-alpine
    container_name: grubgate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - grubgate-network

  # GrubGate API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grubgate-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/grubgate?authSource=admin
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - grubgate-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  grubgate-network:
    driver: bridge
