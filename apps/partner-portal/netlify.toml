# Netlify configuration for Partner Portal (SSR Monorepo Setup)

[build]
  # Build command with the syntax error fixed (removed extra quote at the end).
  command = "cd ../.. && npm install --ignore-scripts && cd apps/partner-portal && npm run build && cp -r dist/client/* dist/"
  
  # This is the key fix. The publish directory is "dist", relative to the 
  # "Base directory" ("apps/partner-portal") set in the Netlify UI.
  publish = "dist"
  
  # The directory for your regular Netlify Functions.
  functions = "netlify/functions"
  
  # Include necessary files for the SSR function to render the page.
  included_files = ["dist/client/index.html", "dist/client/.vite/manifest.json"]

[build.environment]
  # Specify Node.js and npm versions for build consistency.
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# --- REDIRECTS ---
# The order is critical: static assets first, then API, then the SSR catch-all.

# Serve static assets directly from the publish directory.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

# Proxy API requests to your serverless functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SSR Fallback: Send all other page requests to the ssr function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200

# --- HEADERS ---
# Define caching, security, and content type policies.

# Cache versioned assets for one year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and icons for one day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# PWA and Service Worker headers.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Prevent caching of HTML to ensure fresh content from SSR.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Strong security headers for all pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CORS headers for your API endpoints.
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"