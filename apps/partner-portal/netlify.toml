# Netlify configuration for Partner Portal (Monorepo)

[build]
  # Install dependencies with explicit Rollup binary installation
  command = "cd ../.. && rm -rf node_modules && npm install && npm install @rollup/rollup-linux-x64-gnu --save-optional && cd apps/partner-portal && npm run build && node -e \"const fs=require('fs'),path=require('path');['assets','icons','images'].forEach(d=>fs.mkdirSync(path.join('dist',d),{recursive:true}));const copy=(s,d)=>{try{fs.cpSync(s,d,{recursive:true,force:true})}catch(e){}};copy('dist/client/assets','dist/assets');copy('dist/client/icons','dist/icons');copy('dist/client/images','dist/images');['index.html','manifest.json','service-worker.js'].forEach(f=>{try{fs.copyFileSync(path.join('dist/client',f),path.join('dist',f))}catch(e){}});\""
  
  # The directory with the static assets from the client build (relative to base directory)
  # Changed to match Netlify dashboard setting
  publish = "dist"
  
  # The directory where your REGULAR Netlify Functions are located (relative to base directory)
  functions = "netlify/functions"
  
  # Include the built HTML template and manifest in the functions bundle
  included_files = ["dist/client/index.html", "dist/client/manifest.json"]

[build.environment]
  # Specify Node.js version for compatibility
  NODE_VERSION = "20"
  # Set npm version to ensure compatibility
  NPM_VERSION = "10"

# Static asset redirects (serve directly from publish directory)
# These must come BEFORE the catch-all SSR redirect and should NOT go to functions
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

# Serve JavaScript modules and other static files directly with proper MIME types
# Note: Assets are in /assets/ directory, so these rules handle both patterns
[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200
  force = true

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200
  force = true

[[redirects]]
  from = "/*.map"
  to = "/:splat.map"
  status = 200
  force = true

# API and function routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Main SPA redirect - this handles all page routes
# This redirect rule is the key to making SSR work.
# It tells Netlify to send all page requests to your ssr function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = false

# Define caching policies for different asset types to improve performance.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# JavaScript and CSS files with proper MIME types
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

# PWA specific headers
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Prevent caching of HTML pages to avoid stale SSR content
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Prevent caching of the main entry point
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CORS headers for API requests
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

