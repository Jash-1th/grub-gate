# Netlify configuration for Partner Portal (SSR Monorepo Setup)

[build]
  # Build command modified to explicitly install the missing Rollup package as a workaround.
  command = "cd ../.. && npm install --ignore-scripts && npm install @rollup/rollup-linux-x64-gnu --save-optional && cd apps/partner-portal && npm run build && cp -r dist/client/* dist/ && ls -la dist/ && echo 'Checking for service worker files:' && ls -la dist/*.js"
  
  # The publish directory is "dist", relative to the 
  # "Base directory" ("apps/partner-portal") set in the Netlify UI.
  publish = "dist"
  
  # The directory for your regular Netlify Functions.
  functions = "netlify/functions"

[build.environment]
  # Specify Node.js and npm versions for build consistency.
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# --- REDIRECTS ---
# The order is critical: static assets first, then API, then the SSR catch-all.

# Serve static assets directly from the publish directory.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

# Add redirect for firebase messaging service worker
[[redirects]]
  from = "/firebase-messaging-sw.js"
  to = "/firebase-messaging-sw.js"
  status = 200
  force = true

# Note: Partner Portal doesn't have its own API functions
# All API requests are handled by the external backend via axios client
# No API redirect needed since we use full URLs in the API client

# SSR Fallback: Send all other page requests to the ssr function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200

# --- HEADERS ---
# Define caching, security, and content type policies.

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
