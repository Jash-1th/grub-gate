[build]
  # Netlify runs the build from the repo root even when using a package directory.
  # Install workspace deps from the repo root, then build the dasher-app workspace.
  command = "npm ci --workspaces --include-workspace-root && npm --workspace=dasher-app run build"

  # When Netlify Base directory is the repo root, publish must include the app path.
  publish = "apps/dasher-app/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# React Router (SPA) fallback so refresh on nested routes works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
