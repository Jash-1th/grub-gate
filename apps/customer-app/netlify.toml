# Netlify configuration for Customer App (Monorepo)

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[build]
  # Build from root directory to install all workspace dependencies
  command = "cd ../.. && rm -rf node_modules package-lock.json && npm install && cd apps/customer-app && npm run build"
  
  # The directory with the static assets from the client build (relative to repo root)
  publish = "dist/client"
  
  # The directory where your REGULAR Netlify Functions are located (relative to customer-app)
  functions = "netlify/functions"

# This redirect rule is the key to making SSR work.
# It tells Netlify to send all page requests to your ssr.js function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200

# Define caching policies for different asset types to improve performance.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Prevent caching of HTML pages to avoid stale SSR content
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Prevent caching of the main entry point
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
